services:
  - type: web
    name: anime-library
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anime-library-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: anime-library-cache
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ANILIST_API_URL
        value: https://graphql.anilist.co

  - type: keyvalue
    name: anime-library-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: anime-library-db
    plan: free
    region: frankfurt
    databaseName: anime_library
    user: anime_library
    ipAllowList: []

