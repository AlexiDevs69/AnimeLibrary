services:
  - type: web
    name: anime-library
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anime-library-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: anime-library-cache
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ANILIST_API_URL
        value: https://graphql.anilist.co
      - key: ANILIBRIA_ENABLED
        value: "true"
      - key: ANILIBRIA_API_URL
        value: https://anilibria.top/api/v1
      - key: ANILIBRIA_SYNC_TTL_SECONDS
        value: "21600"
      - key: ANILIBRIA_MAX_RESULTS
        value: "10"
      - key: ANILIBRIA_PREFERRED_QUALITY
        value: "1080"
      - key: ANILIBRIA_HLS_HOST_SUFFIXES
        value: libria.fun,anilibria.top
      - key: KODIK_API_URL
        value: https://kodikapi.com
      - key: KODIK_TOKEN
        sync: false
      - key: KODIK_PLAYER_ORIGINS
        value: https://kodik.info
      - key: KODIK_SYNC_TTL_SECONDS
        value: "21600"
      - key: KODIK_MAX_TRANSLATIONS
        value: "8"
      - key: APP_NAME
        value: AnimeLibrary
      - key: ADMIN_API_KEY
        sync: false

  - type: keyvalue
    name: anime-library-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: anime-library-db
    plan: free
    region: frankfurt
    databaseName: anime_library
    user: anime_library
    ipAllowList: []
